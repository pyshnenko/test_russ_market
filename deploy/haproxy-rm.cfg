# Add this rule inside the existing frontend main_ssl, before default_backend:
# use_backend backend_rm_tls if { req_ssl_sni -i rm.pyshnet.ru }

backend backend_rm_tls
    mode tcp
    server local_tls 127.0.0.1:9443 send-proxy-v2

frontend frontend_rm_https
    mode http
    bind 127.0.0.1:9443 accept-proxy ssl crt /etc/haproxy/certs/rm.pyshnet.ru.pem alpn h2,http/1.1
    option httplog
    http-request deny unless { hdr(host) -i rm.pyshnet.ru rm.pyshnet.ru:443 }
    http-request set-header X-Forwarded-Host rm.pyshnet.ru
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    default_backend backend_rm_next

backend backend_rm_next
    mode http
    server next 127.0.0.1:3010 check inter 5s fall 3 rise 2
