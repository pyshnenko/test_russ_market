name: CI and demo deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: schedule
          POSTGRES_PASSWORD: schedule-test
          POSTGRES_DB: schedule
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedule -d schedule"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test
          MYSQL_USER: schedule
          MYSQL_PASSWORD: schedule-test
          MYSQL_DATABASE: schedule
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Test PostgreSQL
        env:
          SCHEDULE_TEST_DATABASE_URL: postgresql://schedule:schedule-test@127.0.0.1:5432/schedule
        run: pnpm test
      - name: Test MySQL
        env:
          SCHEDULE_TEST_DATABASE_URL: mysql://schedule:schedule-test@127.0.0.1:3306/schedule
        run: pnpm test
      - run: pnpm build

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy the verified commit over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ||
                ! "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ||
                ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ||
                -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::Check the deployment variables and SSH secrets."
            exit 1
          fi

          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" -i "$ssh_dir/key" "$DEPLOY_USER@$DEPLOY_HOST" \
            deploy-schedule "$GITHUB_SHA"
